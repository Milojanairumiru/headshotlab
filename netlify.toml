[build]
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/portal"
  to = "/track.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200
